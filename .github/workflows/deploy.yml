name: Build and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the whole main pipeline, including publishing latest. Do not interrupt SSH.
concurrency:
  group: mkwealth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PLATFORM: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}
  PUBLIC_BUILD_ARGS: |
    NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
    NEXT_PUBLIC_WHATSAPP_NUMBER=${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
    NEXT_PUBLIC_CALENDLY_URL=${{ vars.NEXT_PUBLIC_CALENDLY_URL }}
    NEXT_PUBLIC_META_PIXEL_ID=${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
    NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
    NEXT_PUBLIC_INSTAGRAM_URL=${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
    NEXT_PUBLIC_LINKEDIN_URL=${{ vars.NEXT_PUBLIC_LINKEDIN_URL }}
    NEXT_PUBLIC_TIKTOK_URL=${{ vars.NEXT_PUBLIC_TIKTOK_URL }}
    NEXT_PUBLIC_YOUTUBE_URL=${{ vars.NEXT_PUBLIC_YOUTUBE_URL }}
    NEXT_PUBLIC_FACEBOOK_URL=${{ vars.NEXT_PUBLIC_FACEBOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test deployment failure handling
        run: node --test tests/deploy.test.cjs

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Enable ARM emulation when requested
        if: env.IMAGE_PLATFORM == 'linux/arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and lint container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: ${{ env.IMAGE_PLATFORM }}
          tags: mkwealth:ci
          build-args: ${{ env.PUBLIC_BUILD_ARGS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test standalone server and image optimization
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'docker logs mkwealth-smoke; docker rm -f mkwealth-smoke >/dev/null' EXIT
          docker run -d --name mkwealth-smoke -p 127.0.0.1:3000:3000 \
            -e TOOLS_ACCESS_SECRET=ci-only-not-a-production-secret mkwealth:ci
          healthy=false
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' mkwealth-smoke)
            if [[ "$status" == healthy ]]; then healthy=true; break; fi
            if [[ "$status" == unhealthy ]]; then break; fi
            sleep 3
          done
          [[ "$healthy" == true ]] || { echo 'Container failed its health check.' >&2; exit 1; }
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/ -o /tmp/mkwealth-home.html
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/images/mk-logo.png -o /dev/null
          curl --fail --silent --show-error --max-time 30 \
            'http://127.0.0.1:3000/_next/image?url=%2Fimages%2Fmk-logo.png&w=64&q=75' -o /dev/null

      - name: Check main before publishing latest
        id: current
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Newer main commit exists; skipping publication and deployment.'
          fi

      - name: Sign in to GitHub Container Registry
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        id: publish
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: ${{ env.IMAGE_PLATFORM }}
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          build-args: ${{ env.PUBLIC_BUILD_ARGS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/mkwealth' }}
      APP_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Skip deployment if main has moved on
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Newer main commit exists; skipping this deployment.'
          fi

      - name: Configure verified SSH connection
        if: steps.current.outputs.deploy == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Set VPS_HOST to a hostname or IPv4 address.' >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Set VPS_USER to the deployment user.' >&2; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$VPS_PORT > 0 && 10#$VPS_PORT <= 65535 )) || { echo 'Invalid VPS_PORT.' >&2; exit 1; }
          [[ "$VPS_DEPLOY_PATH" =~ ^(/[a-zA-Z0-9_-]+)+/?$ ]] || { echo 'VPS_DEPLOY_PATH must be an absolute directory path using letters, digits, underscores or hyphens.' >&2; exit 1; }
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]] || { echo 'Set VPS_SSH_KEY and VPS_KNOWN_HOSTS secrets.' >&2; exit 1; }
          SSH_DIR="$RUNNER_TEMP/mkwealth-ssh"
          umask 077
          mkdir -p "$SSH_DIR"
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          cat > "$SSH_DIR/config" <<EOF
          Host deployment
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile $SSH_DIR/key
            UserKnownHostsFile $SSH_DIR/known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF

      - name: Copy Compose files and deploy the published digest
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_DIR="$RUNNER_TEMP/mkwealth-ssh"
          ssh -F "$SSH_DIR/config" deployment "test -d '$VPS_DEPLOY_PATH' && test -f '$VPS_DEPLOY_PATH/runtime.env'"
          scp -F "$SSH_DIR/config" compose.yaml deploy/deploy.sh "deployment:$VPS_DEPLOY_PATH/"
          ssh -F "$SSH_DIR/config" deployment "bash '$VPS_DEPLOY_PATH/deploy.sh' '$APP_IMAGE'"
          printf 'Deployed `%s` successfully.\n' "$APP_IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH credentials
        if: always()
        run: |
          SSH_DIR="$RUNNER_TEMP/mkwealth-ssh"
          rm -f -- "$SSH_DIR/key" "$SSH_DIR/known_hosts" "$SSH_DIR/config"
